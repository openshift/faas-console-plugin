# Serverless Functions - OLM Install Manifests
# Usage: oc apply -f https://raw.githubusercontent.com/openshift/faas-console-plugin/master/install/install.yaml
#
# Installs:
#   1. OpenShift Serverless operator + Knative Serving
#   2. Serverless Functions operator (deploys the console plugin automatically)
---
# --- OpenShift Serverless operator ---
apiVersion: v1
kind: Namespace
metadata:
  name: openshift-serverless
---
apiVersion: operators.coreos.com/v1
kind: OperatorGroup
metadata:
  name: serverless-operator
  namespace: openshift-serverless
spec: {}
---
apiVersion: operators.coreos.com/v1alpha1
kind: Subscription
metadata:
  name: serverless-operator
  namespace: openshift-serverless
spec:
  channel: stable
  name: serverless-operator
  source: redhat-operators
  sourceNamespace: openshift-marketplace
---
# --- Serverless Functions operator ---
apiVersion: operators.coreos.com/v1alpha1
kind: CatalogSource
metadata:
  name: serverless-functions-catalog
  namespace: openshift-marketplace
spec:
  sourceType: grpc
  image: quay.io/redhat-user-workloads/ocp-serverless-tenant/serverless-functions-fbc-422:latest
  displayName: Serverless Functions
  publisher: Red Hat
  updateStrategy:
    registryPoll:
      interval: "30m"
---
apiVersion: operators.coreos.com/v1alpha1
kind: Subscription
metadata:
  name: serverless-functions
  namespace: openshift-operators
spec:
  channel: candidate-v2
  name: serverless-functions
  source: serverless-functions-catalog
  sourceNamespace: openshift-marketplace
