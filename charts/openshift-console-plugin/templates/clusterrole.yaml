apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ template "openshift-console-plugin.name" . }}
  labels:
    {{- include "openshift-console-plugin.labels" . | nindent 4 }}
rules:
  # Read the cluster's external API server URL from the Infrastructure API.
  # Used by the backend to embed the correct URL in generated kubeconfigs.
  - apiGroups: ["config.openshift.io"]
    resources: ["infrastructures"]
    verbs: ["get"]
