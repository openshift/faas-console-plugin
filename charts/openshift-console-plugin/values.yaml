---
plugin:
  name: ""
  description: ""
  image: ""
  apiServerURL: ""
  ghApiUrl: ""
  # saTokenExpiry is the deploy ServiceAccount token lifetime as a duration,
  # e.g. 30d, 10h, or 7d12h. Empty uses the backend default (30 days).
  saTokenExpiry: ""
  imagePullPolicy: IfNotPresent
  imagePullSecrets: []
  replicas: 2
  port: 9443
  securityContext:
    enabled: true
  podSecurityContext:
    enabled: true
    runAsNonRoot: true
    seccompProfile:
      type: RuntimeDefault
  containerSecurityContext:
    enabled: true
    allowPrivilegeEscalation: false
    capabilities:
      drop:
        - ALL
  resources:
    requests:
      cpu: 10m
      memory: 50Mi
  basePath: /
  certificateSecretName: ""
  serviceAccount:
    create: true
    annotations: {}
    name: ""
  patcherServiceAccount:
    create: true
    annotations: {}
    name: ""
  jobs:
    patchConsoles:
      enabled: true
      image: "registry.redhat.io/openshift4/ose-tools-rhel9@sha256:c7ed54d121d0758d14fc055e70a8aedcc2a67d3ac160ce230a9734d242517566"
      podSecurityContext:
        enabled: true
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containerSecurityContext:
        enabled: true
        allowPrivilegeEscalation: false
        capabilities:
          drop:
            - ALL
      resources:
        requests:
          cpu: 10m
          memory: 50Mi
